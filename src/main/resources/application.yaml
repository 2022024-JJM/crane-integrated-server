spring:
  application:
    name: crane-integrated-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cis?reWriteBatchedInserts=true}
    username: ${DB_USERNAME:cis}
    password: ${DB_PASSWORD:cis}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration/common,classpath:db/migration/{vendor}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: crane-integrated-server
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Redis는 없어도 되는 의존성이라 오래 기다리지 않는다(Lettuce 기본: 연결 10s, 명령 60s).
      connect-timeout: 2s
      timeout: 2s
      repositories:
        enabled: false
  mvc:
    problemdetails:
      enabled: true

logging:
  include-application-name: false
  pattern:
    # JVM은 UTC(-Duser.timezone=UTC)로 돌지만 로그 시각은 KST로 찍는다.
    dateformat: "yyyy-MM-dd HH:mm:ss.SSSXXX,Asia/Seoul"
  file:
    path: ${LOG_PATH:logs}
  logback:
    rollingpolicy:
      # cis.log 기준. cis-error.log는 512MB 상한(합계 2GB)이며 크기·보관일은 같다.
      max-file-size: 50MB
      max-history: 30
      total-size-cap: 1536MB
  level:
    # Kafka 클라이언트 INFO(설정 덤프, 재접속, 리밸런스)는 끈다. 수신 상태는 IngestWatchScheduler가 판정해 남긴다.
    org.apache.kafka: WARN
    # Redis 재접속 시도마다 남는 "Reconnecting ..." INFO. 실패(WARN)와 복구(ReconnectionHandler INFO)는 남는다.
    io.lettuce.core.protocol.ConnectionWatchdog: WARN
    # 30분마다 남기는 WebSocket 통계 한 줄. 세션 수는 요약 로그에 있다.
    org.springframework.web.socket.config.WebSocketMessageBrokerStats: WARN

management:
  endpoint:
    health:
      # /actuator/health/liveness·readiness 를 연다. 컨테이너 헬스체크는 liveness만 본다:
      # 전체 /actuator/health 는 Redis가 없으면 DOWN인데, Redis는 없어도 되는 의존성이라 재시작 사유가 아니다.
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,metrics

cis:
  kafka:
    topic: ocean.crane.indoor.event
    concurrency: 3
    # 외업. 레코드 키가 PLC 장비 이름 하나라 파티션 하나에만 들어오므로 리스너 스레드는 1개다.
    outdoor-topic: ocean.crane.outdoor.event
  push:
    interval: 250ms
  history:
    interval: 1s
    queue-capacity: 10000
    batch-size: 500
    flush-interval: 1s
    max-retries: 3
  state:
    stale-threshold: 30s
  query:
    max-range: 1h
    default-step: 1s
    max-points: 5000
    default-change-limit: 500
    max-change-limit: 5000
  redis:
    state-key: "cis:crane:state"
    snapshot-channel: "cis:crane:snapshots"
  web:
    allowed-origins:
      - "http://localhost:*"
    # 이보다 오래 걸린 /api 요청만 WARN 한 줄로 남긴다(요청마다 남기는 access log는 없다).
    slow-request-threshold: 1s

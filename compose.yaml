# 로컬·배포 공용. 환경 차이는 .env 로만 둔다(.env.prod.example). 로컬은 .env 없이 DB·Redis 만, 배포는 COMPOSE_PROFILES=app 으로 서버까지.
# 서비스는 각각 올리고 내린다(stop app / up -d app / restart redis). `down -v` 는 DB 볼륨을 지우니 배포에서 금지.
# Docker·Podman 공용(docker compose / podman compose). 두 엔진에서 똑같이 동작하는 키만 쓴다.
name: cis

# 모든 서비스의 콘솔 로그에 크기 상한을 둔다. Podman 은 json-file 을 k8s-file 로 받고 보관 개수(max-file)가 없어
# 두지 않는다. Docker 도 max-file 기본값이 1 이라 동작이 같다(상한에 닿으면 지난 로그를 버린다).
x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"

services:
  timescaledb:
    image: docker.io/timescale/timescaledb:latest-pg17
    container_name: cis-timescaledb
    restart: "${CIS_RESTART:-no}"
    ports:
      # 127.0.0.1 에만 묶는다. 외부에 여는 포트는 app 만이다.
      - "127.0.0.1:${CIS_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: cis
      POSTGRES_USER: cis
      # 볼륨을 처음 만들 때만 반영된다.
      POSTGRES_PASSWORD: ${CIS_DB_PASSWORD:-cis}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - cis-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cis -d cis"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  redis:
    image: docker.io/library/redis:8-alpine
    container_name: cis-redis
    restart: "${CIS_RESTART:-no}"
    ports:
      - "127.0.0.1:${CIS_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *logging

  # 프로필 app 일 때만 뜬다. 로컬 bootRun 과 포트·Kafka 컨슈머 그룹이 겹치지 않게.
  app:
    profiles: ["app"]
    # 이미지가 없으면 빌드한다(Dockerfile). 배포는 `compose build app` 으로 미리 빌드하고 태그를 CIS_APP_TAG 로 고정.
    build:
      context: .
    # compose 가 이 이름으로 빌드하므로 두 엔진에서 같다. compose 밖에서 빌드할 때도 localhost/ 까지 적는다
    # (Docker 는 짧은 이름을 docker.io/library/ 로 저장해 compose 가 찾지 못한다).
    image: localhost/crane-integrated-server:${CIS_APP_TAG:-latest}
    container_name: cis-app
    # DB 없이는 기동 실패로 종료하므로(Flyway) 재시작으로 다시 띄운다. Redis 는 없어도 뜬다.
    restart: unless-stopped
    # 첫 기동 순서용. 운영 중 stop/restart 에는 영향 없다.
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://timescaledb:5432/cis?reWriteBatchedInserts=true
      DB_PASSWORD: ${CIS_DB_PASSWORD:-cis}
      REDIS_HOST: redis
      # 브로커가 광고하는 주소. ISL Kafka 는 isl-infra 네트워크 쪽으로 kafka:9092 를 광고한다.
      # 네트워크는 엔진마다(Podman 은 계정마다) 따로라 ISL 과 같은 엔진에서 띄운다.
      KAFKA_BOOTSTRAP_SERVERS: ${CIS_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      LOG_PATH: /app/logs
    ports:
      - "${CIS_APP_PORT:-8080}:8080"
    volumes:
      - cis-logs:/app/logs
    networks:
      - default
      - kafka
    deploy:
      resources:
        limits:
          # JVM 힙은 이 값의 75%(Dockerfile).
          memory: ${CIS_APP_MEMORY:-1g}
    healthcheck:
      # liveness 만 본다(Redis 장애로 unhealthy 가 되지 않게). curl 이 없어 bash 로 요청.
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health/liveness HTTP/1.0\r\n\r\n' >&3 && grep -q '"UP"' <&3
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging: *logging

networks:
  kafka:
    external: true
    name: ${CIS_KAFKA_NETWORK:-isl-infra}

volumes:
  cis-pg: {}
  cis-logs: {}
